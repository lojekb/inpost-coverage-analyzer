<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <title>InPost Skaner Pierścieniowy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
        }
        #map { 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* Styl panelu sterowania */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(25, 25, 25, 0.95);
            color: #fff;
            padding: 25px;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 280px;
            border: 1px solid #444;
        }
        
        .control-panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4em;
            color: #f3c200; /* Kolor kojarzący się z InPostem */
            text-align: center;
        }

        .slider-container { 
            margin-top: 20px; 
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
        }

        .slider-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #ccc;
        }

        input[type=range] { 
            width: 100%; 
            cursor: pointer;
        }

        .info-text {
            font-size: 12px; 
            color: #999; 
            margin-top: 20px;
            text-align: justify;
            line-height: 1.4;
        }
    </style>
</head>
<body>


<div id="map"></div>


<div class="control-panel">
    <h3>Skaner Pierścieniowy</h3>
    
    <div class="slider-container">
        <label>Odległość od (niebieski): <br>
            <span id="minVal" style="font-weight:bold; color: #5555ff; font-size: 1.2em;">300</span> m
        </label>
        <input type="range" id="minDist" min="0" max="2500" step="50" value="300">
    </div>

    <div class="slider-container">
        <label>Odległość do (czerwony): <br>
            <span id="maxVal" style="font-weight:bold; color: #ff5555; font-size: 1.2em;">1200</span> m
        </label>
        <input type="range" id="maxDist" min="100" max="3000" step="50" value="1200">
    </div>

    <p class="info-text">
        Narzędzie izoluje konkretne pasmo braków maszyn InPost. Obszary poniżej limitu "Od" oraz powyżej limitu "Do" stają się przezroczyste. Przesuń mapę, aby przeliczyć.
    </p>
</div>

<script>
    // 1. Inicjalizacja ciemnej mapy z centrum na Warszawę
    var map = L.map('map').setView([52.2297, 21.0122], 12); 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 15
    }).addTo(map);

    var heatLayer = null;
    
    // Pobieranie elementów UI
    var sliderMin = document.getElementById('minDist');
    var sliderMax = document.getElementById('maxDist');
    var outMin = document.getElementById('minVal');
    var outMax = document.getElementById('maxVal');

    // 2. Główna funkcja odpytująca backend (FastAPI)
    async function fetchHeatmapData() {
        var bounds = map.getBounds();
        var minDist = parseFloat(sliderMin.value);
        var maxDist = parseFloat(sliderMax.value);
        
        // Zabezpieczenie przed liczeniem siatki dla całego kraju z bliska (przeciążenie przeglądarki)
        if (map.getZoom() < 10) {
            if (heatLayer) map.removeLayer(heatLayer);
            return; 
        }

        // Budowanie adresu URL z parametrami z suwaków i granicami ekranu
        var url = `/api/heatmap?min_lat=${bounds.getSouth()}&min_lon=${bounds.getWest()}&max_lat=${bounds.getNorth()}&max_lon=${bounds.getEast()}&min_distance=${minDist}&max_distance=${maxDist}`;
        
        try {
            var response = await fetch(url);
            var result = await response.json();
            
            // Czyszczenie starej warstwy
            if (heatLayer) { map.removeLayer(heatLayer); }
            
            // Rysowanie nowej mapy cieplnej
            if (result.data && result.data.length > 0) {
                heatLayer = L.heatLayer(result.data, {
                    radius: 40,        // Zmusza małe punkty do łączenia się
                    blur: 20,          // Wygładza krawędzie
                    maxZoom: 15,
                    max: 0.8,          // Próg, od którego zaczyna się kolor czerwony
                    minOpacity: 0.5,   // Zapobiega zbytniemu znikaniu najniższych wartości
                    gradient: {
                        0.2: 'blue', 
                        0.5: 'lime', 
                        0.8: 'yellow', 
                        1.0: 'red'
                    }
                }).addTo(map);
            }
        } catch (error) {
            console.error("Błąd pobierania danych z backendu:", error);
        }
    }

    // 3. Logika walidacji krzyżowej suwaków (Suwak Min nie może minąć Max)
    sliderMin.oninput = function() {
        if (parseFloat(this.value) >= parseFloat(sliderMax.value)) {
            sliderMax.value = parseFloat(this.value) + 50;
            outMax.innerHTML = sliderMax.value;
        }
        outMin.innerHTML = this.value;
    }
    
    sliderMax.oninput = function() {
        if (parseFloat(this.value) <= parseFloat(sliderMin.value)) {
            sliderMin.value = parseFloat(this.value) - 50;
            outMin.innerHTML = sliderMin.value;
        }
        outMax.innerHTML = this.value;
    }

    // 4. Podpięcie zdarzeń
    // Przeliczenie backendu tylko wtedy, gdy użytkownik PUSZCI suwak (onchange zamiast oninput)
    sliderMin.onchange = fetchHeatmapData;
    sliderMax.onchange = fetchHeatmapData;
    
    // Przeliczanie po przesunięciu mapy lub zmianie przybliżenia
    map.on('moveend', fetchHeatmapData);
    map.on('zoomend', fetchHeatmapData);

    // Pierwsze pobranie danych po załadowaniu strony
    setTimeout(fetchHeatmapData, 500);
</script>

</body>
</html>
